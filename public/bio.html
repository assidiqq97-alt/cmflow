  <!-- Firebase SDK (CDN compat) -->

  <script src="js/firebase-config.js"></script>

  <script src="js/app.js"></script>
  <script src="js/backend.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const clientId = urlParams.get('client');
      const clients = CMFlowStore.getClients();
      
      if (clientId) {
        const client = clients.find(c => c.id === clientId);
        if (client) {
          document.getElementById('bio-title').textContent = client.name;
          document.getElementById('bio-desc').textContent = `${client.industry} à Dakar. Contactez-nous pour toute question ou commande ! 🌟`;
        }
      }
    });
  </script>
